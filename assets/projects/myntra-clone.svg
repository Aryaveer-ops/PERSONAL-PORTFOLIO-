<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMyntra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14192b"/>
      <stop offset="100%" stop-color="#0a0d17"/>
    </linearGradient>
    <linearGradient id="myntraAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3f6c"/>
      <stop offset="100%" stop-color="#fca253"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgMyntra)"/>

  <!-- Top Navigation Mockup -->
  <rect x="0" y="0" width="600" height="52" fill="#101526"/>
  <rect x="0" y="51" width="600" height="1" fill="#242e4c"/>
  
  <!-- Myntra Style Colorful Logo -->
  <path d="M28,26 L36,16 L44,26 L52,16 L60,26" fill="none" stroke="url(#myntraAccent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="30" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" letter-spacing="1">MYNTRA</text>

  <!-- Nav links -->
  <text x="165" y="30" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">MEN</text>
  <text x="210" y="30" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="11">WOMEN</text>
  <text x="275" y="30" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="11">KIDS</text>
  <text x="325" y="30" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="11">BEAUTY</text>

  <!-- Search Bar -->
  <rect x="385" y="12" width="140" height="28" rx="14" fill="#1b2238" stroke="#303b5e" stroke-width="1"/>
  <text x="405" y="30" fill="#71717a" font-family="'Segoe UI', sans-serif" font-size="10">Search for products...</text>
  
  <!-- Cart & Profile Icons -->
  <circle cx="550" cy="26" r="10" fill="#1f2740"/>
  <circle cx="575" cy="26" r="10" fill="#ff3f6c" opacity="0.9"/>
  <text x="575" y="29" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle" font-weight="bold">3</text>

  <!-- Hero Sale Banner Inside Clone -->
  <g transform="translate(25, 70)">
    <rect width="550" height="100" rx="12" fill="url(#neonPurple)" opacity="0.9"/>
    <!-- Abstract banner decorative shapes -->
    <circle cx="480" cy="50" r="45" fill="#ffffff" opacity="0.1"/>
    <circle cx="510" cy="20" r="25" fill="#ffffff" opacity="0.15"/>
    <text x="30" y="42" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="20">SUMMER COLLECTION 2026</text>
    <text x="30" y="65" fill="#e0e7ff" font-family="'Segoe UI', sans-serif" font-size="12">UP TO 50-70% OFF ON CASUAL &amp; TECH WEAR</text>
    <rect x="30" y="74" width="95" height="20" rx="10" fill="#ffffff"/>
    <text x="77" y="88" fill="#1e1b4b" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" text-anchor="middle">SHOP NOW</text>
  </g>

  <!-- Product Grid Cards Mockup -->
  <g transform="translate(25, 190)">
    <!-- Product 1 -->
    <g transform="translate(0, 0)">
      <rect width="125" height="145" rx="8" fill="#151c30" stroke="#252f4c" stroke-width="1"/>
      <rect x="8" y="8" width="109" height="78" rx="6" fill="#1f2845"/>
      <!-- Graphic T-shirt silhouette -->
      <path d="M45,30 L62,22 L80,30 L73,42 L66,37 L66,74 L48,74 L48,37 L41,42 Z" fill="#8b5cf6" opacity="0.8"/>
      <text x="12" y="102" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Urban Tech Tee</text>
      <text x="12" y="116" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="9">Oversized Cotton</text>
      <text x="12" y="134" fill="#06b6d4" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">₹799</text>
      <text x="45" y="134" fill="#71717a" font-family="'Segoe UI', sans-serif" font-size="9" text-decoration="line-through">₹1,499</text>
    </g>

    <!-- Product 2 -->
    <g transform="translate(142, 0)">
      <rect width="125" height="145" rx="8" fill="#151c30" stroke="#252f4c" stroke-width="1"/>
      <rect x="8" y="8" width="109" height="78" rx="6" fill="#1f2845"/>
      <!-- Hoodie silhouette -->
      <path d="M40,30 L62,20 L84,30 L76,46 L68,40 L68,76 L44,76 L44,40 L36,46 Z" fill="#06b6d4" opacity="0.8"/>
      <text x="12" y="102" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Cyber Hoodie</text>
      <text x="12" y="116" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="9">Fleece Pullover</text>
      <text x="12" y="134" fill="#06b6d4" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">₹1,299</text>
      <text x="52" y="134" fill="#71717a" font-family="'Segoe UI', sans-serif" font-size="9" text-decoration="line-through">₹2,599</text>
    </g>

    <!-- Product 3 -->
    <g transform="translate(284, 0)">
      <rect width="125" height="145" rx="8" fill="#151c30" stroke="#252f4c" stroke-width="1"/>
      <rect x="8" y="8" width="109" height="78" rx="6" fill="#1f2845"/>
      <!-- Sneaker silhouette -->
      <path d="M40,65 C40,48 55,42 70,42 L80,48 L88,60 C90,66 84,72 75,72 L45,72 C40,72 40,68 40,65 Z" fill="#ec4899" opacity="0.8"/>
      <text x="12" y="102" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Retro Runners</text>
      <text x="12" y="116" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="9">Air Cushioned</text>
      <text x="12" y="134" fill="#06b6d4" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">₹2,199</text>
      <text x="52" y="134" fill="#71717a" font-family="'Segoe UI', sans-serif" font-size="9" text-decoration="line-through">₹3,999</text>
    </g>

    <!-- Product 4 -->
    <g transform="translate(426, 0)">
      <rect width="125" height="145" rx="8" fill="#151c30" stroke="#252f4c" stroke-width="1"/>
      <rect x="8" y="8" width="109" height="78" rx="6" fill="#1f2845"/>
      <!-- Watch silhouette -->
      <circle cx="62" cy="48" r="18" fill="#10b981" opacity="0.8"/>
      <rect x="56" y="24" width="12" height="48" rx="3" fill="#059669" opacity="0.6"/>
      <text x="12" y="102" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Smart Chrono</text>
      <text x="12" y="116" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="9">Fitness Tracker</text>
      <text x="12" y="134" fill="#06b6d4" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">₹1,849</text>
      <text x="52" y="134" fill="#71717a" font-family="'Segoe UI', sans-serif" font-size="9" text-decoration="line-through">₹2,999</text>
    </g>
  </g>
</svg>