<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12182c"/>
      <stop offset="100%" stop-color="#080b15"/>
    </linearGradient>
    <linearGradient id="userBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="aiBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19233e"/>
      <stop offset="100%" stop-color="#131b30"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgChat)"/>

  <!-- Top Chat Header -->
  <rect x="25" y="20" width="550" height="50" rx="10" fill="#161f36" stroke="#253258" stroke-width="1"/>
  <circle cx="52" cy="45" r="14" fill="#8B5CF6"/>
  <!-- Glowing AI robot/sparkle icon -->
  <path d="M48,45 L52,38 L56,45 L63,49 L56,53 L52,60 L48,53 L41,49 Z" fill="#ffffff"/>
  <text x="76" y="43" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold">AryaBot • Personal AI Assistant</text>
  <text x="76" y="56" fill="#10b981" font-family="sans-serif" font-size="9">● Online • NLP Neural Engine</text>

  <rect x="475" y="32" width="85" height="24" rx="12" fill="#06B6D4" opacity="0.15"/>
  <text x="517" y="48" fill="#06B6D4" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">v2.4 Ready</text>

  <!-- Message Stream Area -->
  <g transform="translate(25, 82)">
    <!-- User Message 1 -->
    <g transform="translate(180, 10)">
      <rect width="350" height="42" rx="14" fill="url(#userBubble)"/>
      <text x="18" y="26" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12">Can you explain gradient descent in simple terms?</text>
    </g>

    <!-- AI Response 1 -->
    <g transform="translate(20, 64)">
      <circle cx="16" cy="20" r="12" fill="#06B6D4" opacity="0.3"/>
      <circle cx="16" cy="20" r="6" fill="#06B6D4"/>
      
      <rect x="36" y="4" width="450" height="74" rx="14" fill="url(#aiBubble)" stroke="#263456" stroke-width="1"/>
      <text x="52" y="26" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11.5">Think of it like walking down a misty mountain in the dark:</text>
      <text x="52" y="44" fill="#c4b5fd" font-family="'Segoe UI', sans-serif" font-size="11.5">You feel the slope under your feet and take small steps in</text>
      <text x="52" y="62" fill="#c4b5fd" font-family="'Segoe UI', sans-serif" font-size="11.5">the steepest downward direction until reaching the lowest valley (minimum error)!</text>
    </g>

    <!-- User Message 2 -->
    <g transform="translate(230, 150)">
      <rect width="300" height="38" rx="14" fill="url(#userBubble)"/>
      <text x="18" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12">Awesome analogy! What about learning rate?</text>
    </g>

    <!-- AI Typing / Streaming indicator -->
    <g transform="translate(20, 198)">
      <circle cx="16" cy="18" r="12" fill="#06B6D4" opacity="0.3"/>
      <circle cx="16" cy="18" r="6" fill="#06B6D4"/>
      
      <rect x="36" y="4" width="80" height="30" rx="14" fill="url(#aiBubble)" stroke="#263456" stroke-width="1"/>
      <!-- Animated dots -->
      <circle cx="56" cy="19" r="3" fill="#8B5CF6">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="70" cy="19" r="3" fill="#06B6D4">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="84" cy="19" r="3" fill="#10b981">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Input Bar Mockup at Bottom -->
  <g transform="translate(25, 305)">
    <rect width="550" height="42" rx="21" fill="#141a2e" stroke="#253258" stroke-width="1"/>
    <text x="24" y="26" fill="#71717a" font-family="'Segoe UI', sans-serif" font-size="11">Type your message or ask a question...</text>
    <circle cx="522" cy="21" r="14" fill="#8B5CF6"/>
    <path d="M518,16 L528,21 L518,26 Z" fill="#ffffff"/>
  </g>
</svg>