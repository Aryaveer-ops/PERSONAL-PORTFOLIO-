<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#080B14" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2640" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#101525" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient background glow circles -->
  <circle cx="300" cy="300" r="230" fill="url(#bgGlow)" filter="url(#glow)"/>
  <circle cx="300" cy="300" r="190" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 300 300" to="360 300 300" dur="40s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="300" r="215" fill="none" stroke="#06B6D4" stroke-width="1" stroke-dasharray="4 12" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="360 300 300" to="0 300 300" dur="30s" repeatCount="indefinite"/>
  </circle>

  <!-- Central Glass Card Platform -->
  <g transform="translate(100, 100)">
    <!-- Main Developer Card Base -->
    <rect x="20" y="30" width="360" height="360" rx="36" fill="url(#cardGrad)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="2"/>
    
    <!-- Code Editor Header -->
    <rect x="20" y="30" width="360" height="42" rx="36" fill="#131A2E" opacity="0.9"/>
    <rect x="20" y="56" width="360" height="16" fill="#131A2E" opacity="0.9"/>
    
    <!-- Window dots -->
    <circle cx="48" cy="51" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="65" cy="51" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="82" cy="51" r="5" fill="#10B981" opacity="0.8"/>
    <text x="200" y="55" fill="#A1A1AA" font-family="'Courier New', monospace" font-size="12" text-anchor="middle">aryaveer_core.py</text>

    <!-- Developer Character / Geometric Representation -->
    <g transform="translate(180, 165)">
      <!-- Shoulders & Hoodie -->
      <path d="M-85,140 C-85,95 -60,80 0,80 C60,80 85,95 85,140 Z" fill="#182035" stroke="url(#primaryGrad)" stroke-width="2"/>
      
      <!-- Head / Face silhouette -->
      <circle cx="0" cy="20" r="46" fill="#1F2942" stroke="#8B5CF6" stroke-width="2"/>
      
      <!-- Smart Eyewear / HUD Visor -->
      <path d="M-30,12 L30,12 C34,12 36,15 35,19 L32,28 C30,33 26,36 21,36 L-21,36 C-26,36 -30,33 -32,28 L-35,19 C-36,15 -34,12 -30,12 Z" fill="#080B14" stroke="#06B6D4" stroke-width="2"/>
      <line x1="-25" y1="24" x2="25" y2="24" stroke="#06B6D4" stroke-width="2" opacity="0.8"/>
      
      <!-- Glowing headphones -->
      <path d="M-52,22 C-52,2 -40,-26 0,-26 C40,-26 52,2 52,22" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
      <rect x="-56" y="10" width="8" height="24" rx="4" fill="#06B6D4"/>
      <rect x="48" y="10" width="8" height="24" rx="4" fill="#06B6D4"/>

      <!-- Laptop / Terminal Desk -->
      <path d="M-100,165 L100,165 L85,145 L-85,145 Z" fill="#101525" stroke="#374151" stroke-width="1.5"/>
      <rect x="-60" y="115" width="120" height="42" rx="4" fill="#080B14" stroke="#06B6D4" stroke-width="1.5"/>
      <!-- Glowing screen display -->
      <line x1="-50" y1="125" x2="-10" y2="125" stroke="#8B5CF6" stroke-width="2"/>
      <line x1="-50" y1="133" x2="20" y2="133" stroke="#06B6D4" stroke-width="2"/>
      <line x1="-50" y1="141" x2="-25" y2="141" stroke="#10B981" stroke-width="2"/>
      <circle cx="35" cy="133" r="10" fill="none" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="35" cy="133" r="4" fill="#06B6D4"/>
    </g>

    <!-- Floating Mini Code Badges -->
    <g transform="translate(45, 95)">
      <rect width="115" height="34" rx="8" fill="#101525" stroke="#8B5CF6" stroke-width="1" opacity="0.9"/>
      <text x="12" y="22" fill="#8B5CF6" font-family="monospace" font-size="12" font-weight="bold">&lt;AI / DS&gt;</text>
      <circle cx="95" cy="17" r="4" fill="#10B981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(245, 290)">
      <rect width="120" height="34" rx="8" fill="#101525" stroke="#06B6D4" stroke-width="1" opacity="0.9"/>
      <text x="12" y="22" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="bold">model.fit()</text>
      <path d="M96,17 L102,12 L108,22 L114,15" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- AI Neural Network Nodes in Background of Card -->
    <g stroke="#8B5CF6" stroke-width="1" opacity="0.35">
      <line x1="60" y1="160" x2="110" y2="200"/>
      <line x1="60" y1="240" x2="110" y2="200"/>
      <line x1="110" y1="200" x2="140" y2="230"/>
      <line x1="290" y1="160" x2="330" y2="190"/>
      <line x1="290" y1="230" x2="330" y2="190"/>
      <circle cx="60" cy="160" r="3" fill="#8B5CF6"/>
      <circle cx="60" cy="240" r="3" fill="#8B5CF6"/>
      <circle cx="110" cy="200" r="3" fill="#06B6D4"/>
      <circle cx="140" cy="230" r="3" fill="#8B5CF6"/>
      <circle cx="290" cy="160" r="3" fill="#06B6D4"/>
      <circle cx="290" cy="230" r="3" fill="#8B5CF6"/>
      <circle cx="330" cy="190" r="3" fill="#06B6D4"/>
    </g>
  </g>
</svg>